apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-deployment
  labels:
    app: spring-petclinic
spec:
  replicas: 1  # Number of replicas for high availability
  selector:
    matchLabels:
      app: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
    spec:
      containers:
        - name: spring-petclinic
          image: maruthigs/spring-petclinic:latest  # Replace with your Docker image
          ports:
            - containerPort: 8080  # The port your app listens on inside the container
          resources:
            limits:
              memory: "512Mi"
              cpu: "1"
            requests:
              memory: "256Mi"
              cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-service
spec:
  selector:
    app: spring-petclinic  # This must match the label in the deployment
  ports:
    - protocol: TCP
      port: 80               # The port that will be exposed outside the cluster
      targetPort: 8080       # The port on which your app is listening inside the container
  type: LoadBalancer  # Expose service to external traffic (use ClusterIP for internal-only access)
